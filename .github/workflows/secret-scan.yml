name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly. The gitleaks-action@v2 wrapper requires a
      # paid GITLEAKS_LICENSE for GitHub organizations and errored before scanning
      # ("missing gitleaks license"), so every PR failed this check. The binary is
      # free and does the same scan.
      - name: Run gitleaks (license-free CLI)
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
